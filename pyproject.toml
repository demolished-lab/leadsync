[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsync"
version = "1.0.0"
description = "Autonomous sales follow-up platform with intelligent LLM fallback, multi-channel alerting, and real-time pipeline"
requires-python = ">=3.10"
keywords = ["sales", "ai", "follow-up", "crm", "automation", "llm", "pipeline", "leads"]
authors = [
    {name = "LeadSync Team", email = "team@leadsync.dev"},
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "bleach>=6.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "websocket-client>=1.6.0",
    "pyyaml>=6.0",
    "fpdf2>=2.7.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "qrcode[pil]>=7.4.0",
    "segno>=1.5.0",
    # Hard-required by core (verified by grep): core/database imports sqlalchemy
    # unconditionally; core/monitoring uses prometheus_client; api/app.py uses
    # UploadFile/File (needs python-multipart); Redis is the out-of-box queue
    # backend (code guards the import, but USE_REDIS=true must work as shipped).
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.19",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    # Gmail API ingestion (core/ingest/gmail_api.py uses googleapiclient/google.auth)
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]
email = [
    "imapclient>=2.3.0",
    "email-validator>=2.0.0",
]
llm = [
    "openai>=1.30.0",
    "anthropic>=0.5.0",
]
stt = [
    "openai-whisper>=20231117",
]
database = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
redis = [
    "redis>=5.0.0",
]
ui = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]
monitoring = [
    "prometheus-fastapi-instrumentator>=5.0.0",
]
all = [
    "leadsync[dev,email,llm,stt,database,redis,ui,monitoring]",
]

[project.scripts]
# Points at api.app:main (context-managed uvicorn.run wrapper added for this
# purpose; api.app:app was invalid — it's a FastAPI instance, not callable).
sales-followup = "api.app:main"

[tool.setuptools.packages.find]
include = ["core*", "api*"]
exclude = ["tests*", "docker*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
